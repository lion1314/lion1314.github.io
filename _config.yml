# Hexo 站点配置 —— https://hexo.io/docs/configuration.html
title: wen 的博客
subtitle: AI 工具 · 开发者工具 · 技术实践
description: 记录 AI 工具、开发者工具与技术实践
author: wen
language: zh-CN
timezone: Asia/Shanghai

# 站点地址：GitHub Pages 用户站点，根路径部署
url: https://lion1314.github.io
root: /
permalink: posts/:year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# 目录
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
i18n_dir: :lang
skip_render:

# 写作
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  exclude: []
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

# 代码高亮
highlight:
  enable: true
  line_number: false
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: false
  tab_replace: ''

# 首页 / 分类 / 标签 / 归档
index_generator:
  path: ''
  per_page: 8
  order_by: -date
archive_generator:
  per_page: 0
  yearly: true
  monthly: false
  daily: false
category_generator:
  per_page: 8
  enable_index_page: false
tag_generator:
  per_page: 8
  enable_index_page: false
default_category: uncategorized
category_map:
tag_map:

# 其他
date_format: YYYY-MM-DD
time_format: HH:mm:ss
per_page: 8
pagination_dir: page
meta_generator: false
feed:
  type: atom
  path: atom.xml
  limit: 20
  content: false
  order_by: -date
sitemap:
  path: sitemap.xml

# 使用仓库内自研主题（themes/aurora），无需额外安装主题包
theme: aurora
